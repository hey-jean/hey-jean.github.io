<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 시작 홈페이지</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="school" href="https://www.sdu.ac.kr/" target="_blank" rel="noopener"><b>SDU</b> 서울디지털대학교</a>
    <div class="weather">
      <div class="w" id="seoul"><span class="icon">⏳</span><span class="city">서울</span><span class="temp">--°</span><span class="desc">불러오는 중</span></div>
      <div class="w" id="jeju"><span class="icon">⏳</span><span class="city">제주</span><span class="temp">--°</span><span class="desc">불러오는 중</span></div>
    </div>
  </header>

  <main class="container">
    <form class="search-form" action="https://www.google.com/search" method="get">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" name="q" id="q" placeholder="Google 검색" autocomplete="off" autofocus>
      </div>
      <div class="buttons">
        <button type="submit">Google 검색</button>
        <button type="button" id="lucky">I'm Feeling Lucky</button>
      </div>
    </form>
  </main>

  <footer>
    <p id="quote-text"></p>
    <p id="quote-author"></p>
    <button id="next-quote" type="button">다른 명언 보기</button>
  </footer>
  <script src="script.js?v=3"></script>
</body>
</html>
