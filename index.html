<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 시작 홈페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <form class="search" action="https://www.google.com/search" method="get" target="_blank">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" name="q" id="q" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
      <button type="submit">검색</button>
    </form>

    <section class="weather">
      <div class="card" id="seoul">
        <div class="city">서울</div>
        <div class="icon">⏳</div>
        <div class="temp">--°</div>
        <div class="desc">불러오는 중…</div>
      </div>
      <div class="card" id="jeju">
        <div class="city">제주</div>
        <div class="icon">⏳</div>
        <div class="temp">--°</div>
        <div class="desc">불러오는 중…</div>
      </div>
    </section>

    <section class="quote">
      <p id="quote-text"></p>
      <p id="quote-author"></p>
      <button id="next-quote" type="button">다른 명언 보기</button>
    </section>
  </main>
  <footer>날씨 정보: Open-Meteo</footer>
  <script src="script.js"></script>
</body>
</html>
